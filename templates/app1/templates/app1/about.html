<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
</head>
<body>
    <div style="background-color: bisque;font-family: Arial, sans-serif; padding: 20px; border-radius: 5px;">
    <h1>About Us</h1>
    <h3>we are - {{ name }}</h3>
    <p>{{ description }}</p>
    <p>Address: {{ address }}</p>
    <p>Date: {{ date|date:"SHORT_DATE_FORMAT" }}</p>
    <p>Time:{{date|time:"TIME_FORMAT"}}</p>
    </div>

    <!-- #----------------- DTL (Django Template Language) --------------------------- -->
    {% comment %}comment in DTL{% endcomment %} 

</body>
</html>
