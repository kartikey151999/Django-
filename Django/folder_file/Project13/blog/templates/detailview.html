{% extends "base.html" %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <a href="{% url 'PostUpdateView' post.pk %}" class="btn btn-primary">Edit</a>
    <a href="{% url 'PostDeleteView' post.pk %}" class="btn btn-danger">Delete</a>  
    <a href="{% url 'PostListView' %}" class="btn btn-secondary">Back to List</a>
{% endblock %}
